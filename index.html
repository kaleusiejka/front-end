<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{/*box level*/

            /*display: inline; pode mudar o elemento box level e vice versa */
            background-color: rgb(112, 176, 181);
            height: 300px;
            width: 300px;
           
            /* solid e o border style e o px é do width*/
           

            border: 10px solid rgb(34, 92, 173);

            padding: 10px, 20px;

            margin: 20px auto 40px auto;

            outline: 5px dashed rgb(25, 0, 255);
        }

        a{ 
            border-width: 10px;

            border-style: solid;

            border-color: rgb(120, 173, 205);

            padding: 10px,
          
        }

  
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
